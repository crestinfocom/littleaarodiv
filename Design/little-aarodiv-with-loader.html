<meta name="theme-color" content="#2B2840">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF7F1;--cream2:#F5EEE3;--ink:#2B2840;--muted:#6E6A80;--coral:#EE7B6A;--coral-d:#D9604F;--sage:#7FAE8E;--sky:#8EC3E0;--gold:#E9B04A;--lav:#AE9BD8;--line:#ECE4D8;--r:22px;--sh:0 22px 50px -24px rgba(43,40,64,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;line-height:1.15;letter-spacing:-.01em}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none;cursor:pointer}
.container{width:min(1200px,92%);margin:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:700;border:0;cursor:pointer;font-family:inherit;font-size:15px;transition:.25s;white-space:nowrap}
.btn-p{background:var(--coral);color:#fff;box-shadow:0 12px 24px -12px var(--coral)}.btn-p:hover{background:var(--coral-d);transform:translateY(-2px)}
.btn-o{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}.btn-o:hover{background:var(--ink);color:#fff}
.btn-g{background:var(--cream2);color:var(--ink)}.btn-g:hover{background:#EDE3D4}
.btn-d{background:#FDECEA;color:#B33A2B}.btn-d:hover{background:#FAD9D4}
.btn-s{padding:8px 16px;font-size:13px}
.btn-xs{padding:5px 11px;font-size:12px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--coral-d)}
.muted{color:var(--muted)}
/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(251,247,241,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .container{display:flex;align-items:center;justify-content:space-between;height:80px;gap:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:'Fraunces',serif;font-size:23px;display:block;line-height:1;font-weight:700}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.05em;font-style:italic;font-family:'Fraunces',serif}
.links{display:flex;gap:30px;align-items:center}
.links a{font-weight:700;font-size:15px;color:var(--muted);position:relative}
.links a.on,.links a:hover{color:var(--ink)}
.links a.on:after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--coral);border-radius:2px}
.nav-cta{display:flex;gap:10px}
.burger{display:none;background:none;border:0;font-size:26px;cursor:pointer;color:var(--ink)}
/* HERO */
.hero{padding:64px 0 90px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#FBE0D6 0,transparent 70%);right:-120px;top:-120px;z-index:-1}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:60px;align-items:center}
.hero h1{font-size:clamp(40px,5.4vw,70px);margin:22px 0}
.hero h1 em{font-style:italic;color:var(--coral)}
.lead{font-size:18px;color:var(--muted);max-width:520px}
.hero-btns{display:flex;gap:14px;margin:34px 0;flex-wrap:wrap}
.trust{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.faces{display:flex}.faces span{width:40px;height:40px;border-radius:50%;border:3px solid var(--cream);margin-left:-10px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}.faces span:first-child{margin-left:0}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,#F8D9CF,#D7E8F2)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1);filter:saturate(1.04) contrast(1.02)}
.ph:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(43,40,64,.18));pointer-events:none}
.collage .ph:hover img,.split .ph:hover img{transform:scale(1.05)}
.hero h1{text-wrap:balance}
.collage{position:relative;height:560px}
.collage .ph{position:absolute;border-radius:30px;box-shadow:var(--sh)}
.c1{left:0;top:0;width:62%;height:78%}.c2{right:0;top:10%;width:36%;height:44%}.c3{right:4%;bottom:0;width:50%;height:38%;border:6px solid var(--cream)}
.float{position:absolute;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;font-size:13px;font-weight:700;animation:bob 5s ease-in-out infinite;z-index:2}
.float i{font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.float small{display:block;font-weight:600;color:var(--muted);font-size:11px}
@keyframes bob{50%{transform:translateY(-10px)}}
/* SECTIONS */
section{padding:90px 0}
.sec-h{text-align:center;max-width:660px;margin:0 auto 54px}
.sec-h h2{font-size:clamp(30px,3.6vw,46px);margin:14px 0 12px}
.sec-h h2 em{color:var(--coral);font-style:italic}
.sec-h p{color:var(--muted);font-size:17px}
.grid{display:grid;gap:26px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border-radius:var(--r);padding:30px;border:1px solid var(--line);transition:.3s}
.card.hov:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.card h3{font-size:21px;margin-bottom:8px}
.card p{color:var(--muted);font-size:15px}
.ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;margin-bottom:18px}
.t-coral{background:#FDE7E2}.t-sage{background:#E3F0E7}.t-sky{background:#E1EFF8}.t-gold{background:#FBF0D9}.t-lav{background:#EEE9F8}.t-pink{background:#FBE6EF}
.prog{border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line);transition:.3s;display:flex;flex-direction:column}
.prog:hover{transform:translateY(-6px);box-shadow:var(--sh)}.prog:hover img{transform:scale(1.06)}
.prog .ph{height:230px}
.prog .age{position:absolute;top:16px;left:16px;background:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;z-index:1}
.prog .bd{padding:26px;flex:1;display:flex;flex-direction:column}
.prog h3{font-size:23px;margin-bottom:8px}
.prog p{color:var(--muted);font-size:15px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);margin-top:20px;padding-top:16px;font-size:14px;gap:10px;flex-wrap:wrap}
.meta b{font-family:'Fraunces',serif;font-size:20px}
.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.day .card{padding:24px;position:relative}
.day .time{font-family:'Fraunces',serif;color:var(--coral);font-size:15px;font-weight:700}
.day h4{font-size:18px;margin:6px 0 4px}
.band{background:var(--ink);color:#fff;border-radius:34px;padding:54px 40px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:20px;position:relative;overflow:hidden}
.band:after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(238,123,106,.18);right:-80px;top:-120px}
.band b{font-family:'Fraunces',serif;font-size:50px;color:var(--gold);display:block;line-height:1.1}
.band span{color:#C9C5DA;font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split .ph{border-radius:30px;height:480px;box-shadow:var(--sh)}
.checks{list-style:none;margin:24px 0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.checks li:before{content:'✓';flex:none;width:24px;height:24px;border-radius:50%;background:#E3F0E7;color:#2F7A4B;display:grid;place-items:center;font-size:13px;font-weight:900}
.quote{background:#fff;border-radius:var(--r);padding:32px;border:1px solid var(--line)}
.quote p{font-family:'Fraunces',serif;font-size:19px;font-style:italic;line-height:1.5;margin:14px 0 22px}
.stars{color:var(--gold);letter-spacing:3px}
.who{display:flex;gap:12px;align-items:center}.who small{display:block;color:var(--muted)}
.ev{display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.ev .dt{flex:none;width:66px;height:70px;border-radius:16px;background:var(--cream2);display:grid;place-items:center;text-align:center;line-height:1.1}
.ev .dt b{font-family:'Fraunces',serif;font-size:26px;display:block}.ev .dt small{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--coral-d)}
.ev h4{font-size:17px}.ev p{font-size:14px;color:var(--muted)}
.cta{background:linear-gradient(120deg,#FDE3DB,#F8EED9 60%,#E3F0E7);border-radius:36px;padding:64px;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.cta h2{font-size:clamp(28px,3.2vw,42px);max-width:620px}
.page-hero{padding:70px 0 30px;text-align:center}
.page-hero h1{font-size:clamp(38px,5vw,62px);margin:16px 0 10px}
.page-hero h1 em{color:var(--coral);font-style:italic}
.page-hero p{color:var(--muted);max-width:620px;margin:auto;font-size:17px}
footer{background:#221F35;color:#BDB8D2;padding:70px 0 28px;margin-top:40px}
footer .fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;gap:40px}
footer h4{color:#fff;font-size:17px;margin-bottom:16px}
footer a{display:block;margin:8px 0;font-size:14px}footer a:hover{color:#fff}
footer .copy{border-top:1px solid rgba(255,255,255,.1);margin-top:50px;padding-top:24px;display:flex;justify-content:space-between;font-size:13px;flex-wrap:wrap;gap:10px}
/* FORMS */
.f{display:grid;gap:16px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{font-size:13px;font-weight:800;display:block;margin-bottom:6px;color:var(--ink)}
input,select,textarea{width:100%;padding:12px 15px;border:1.5px solid var(--line);border-radius:14px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink);outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(238,123,106,.12)}
textarea{min-height:100px;resize:vertical}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.chip{padding:9px 20px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.masonry{columns:3;column-gap:18px}
.gi{break-inside:avoid;margin-bottom:18px;border-radius:20px;overflow:hidden;position:relative;cursor:pointer}
.gi .ph{min-height:200px}.gi:hover img{transform:scale(1.05)}
.gi .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;background:linear-gradient(transparent,rgba(30,27,46,.75));color:#fff;font-weight:700}
.gi .cap small{display:block;font-weight:600;opacity:.8;font-size:12px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;counter-reset:s}
.steps .card{padding:24px;text-align:center}
.steps .card:before{counter-increment:s;content:counter(s);width:42px;height:42px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-family:'Fraunces',serif;font-weight:700;font-size:18px}
details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:12px}
summary{font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary:after{content:'+';font-size:20px;color:var(--coral)}details[open] summary:after{content:'–'}
details p{color:var(--muted);margin-top:10px}
.map{border-radius:24px;overflow:hidden;border:1px solid var(--line);height:100%;min-height:360px}
.map iframe{width:100%;height:100%;min-height:360px;border:0}
/* AUTH */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth .ph{height:100%;min-height:100vh}
.auth .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,40,64,.1),rgba(43,40,64,.8));display:flex;flex-direction:column;justify-content:flex-end;padding:56px;color:#fff;z-index:1}
.auth .ov h2{font-size:42px;margin-bottom:10px}.auth .ov em{color:#FFD3C9}
.auth-f{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-box{width:min(420px,100%)}
.tabs{display:flex;background:var(--cream2);padding:5px;border-radius:999px;margin:26px 0}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:999px;font-weight:800;font-family:inherit;cursor:pointer;color:var(--muted);font-size:14px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(0,0,0,.2)}
.demo{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:14px;font-size:13px;color:var(--muted);margin-top:18px}
/* APP SHELL */
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#BDB8D2;padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:60}
.side .brand{padding:4px 10px 26px;color:#fff}.side .brand small{color:#9F9AB8;font-size:9.5px;white-space:nowrap}.side .brand b{font-size:20px}
.side .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7D7898;padding:12px 14px 8px;font-weight:800}
.side nav a{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;margin-bottom:2px;transition:.2s}
.side nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav a.on{background:var(--coral);color:#fff;box-shadow:0 10px 20px -12px var(--coral)}
.side nav a i{font-style:normal;width:22px;text-align:center}
.side .cnt{margin-left:auto;background:rgba(255,255,255,.15);padding:1px 8px;border-radius:999px;font-size:11px}
.side-foot{margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot a{display:block;padding:9px 14px;font-weight:700;font-size:14px;border-radius:12px}.side-foot a:hover{background:rgba(255,255,255,.06);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;gap:16px}
.top h2{font-size:26px}.top small{color:var(--muted);font-weight:600}
.top .tl{display:flex;gap:14px;align-items:center}
.me{display:flex;gap:12px;align-items:center;font-size:14px}.me b{display:block;line-height:1.2}.me small{font-size:12px}
.menu-t{display:none;background:var(--cream2);border:0;width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer}
.content{padding:30px 32px;flex:1}
.av{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.av.lg{width:72px;height:72px;font-size:24px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:24px}
.kpi .card{padding:22px;display:flex;gap:16px;align-items:center}
.kpi .ic{margin:0;flex:none;width:52px;height:52px}
.kpi b{font-family:'Fraunces',serif;font-size:28px;display:block;line-height:1.1}
.kpi small{color:var(--muted);font-weight:700;font-size:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}
.panel h3{font-size:19px;margin-bottom:4px}
.ph-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.dg{display:grid;gap:22px;margin-bottom:22px}.dg2{grid-template-columns:1.5fr 1fr}.dg3{grid-template-columns:repeat(3,1fr)}.dg11{grid-template-columns:1fr 1fr}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.toolbar .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:200px;padding:10px 14px}
.tb-r{display:flex;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:14px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#FBF8F3;white-space:nowrap;font-weight:800}
td{padding:13px 16px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:hover td{background:#FFFCF8}
.nm{display:flex;gap:10px;align-items:center}.nm small{display:block;color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800}
.b-green{background:#E3F2E8;color:#2F7A4B}.b-amber{background:#FDF1DC;color:#9A6300}.b-red{background:#FDE8E6;color:#B33A2B}.b-blue{background:#E1EFF8;color:#2B6A8F}.b-lav{background:#EEE9F8;color:#5E4B95}.b-grey{background:#F0EEF3;color:#6E6A80}
.bars{display:flex;align-items:flex-end;gap:12px;height:210px;padding-top:26px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bv{width:100%;max-width:46px;background:linear-gradient(180deg,var(--coral),#F6B3A8);border-radius:10px 10px 4px 4px;position:relative;min-height:4px;transition:height .8s}
.bv.s{background:linear-gradient(180deg,var(--sage),#C2DCCB)}
.bv span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap}
.bar small{font-size:11px;color:var(--muted);font-weight:700;margin-top:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.donut{--p:0;width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--sage) calc(var(--p)*1%),#F6CFC8 0);display:grid;place-items:center;margin:10px auto;position:relative}
.donut:after{content:'';position:absolute;inset:22px;background:#fff;border-radius:50%}
.donut b{position:relative;z-index:1;font-family:'Fraunces',serif;font-size:32px;text-align:center;line-height:1}.donut b small{display:block;font-family:'Nunito';font-size:12px;color:var(--muted)}
.legend{display:flex;justify-content:center;gap:18px;font-size:13px;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.list-i{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.list-i:first-of-type{border-top:0}
.list-i div{flex:1;min-width:0}.list-i b{display:block;font-size:14px}.list-i small{color:var(--muted);font-size:13px}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.pipe .card{padding:18px;text-align:center;cursor:pointer}.pipe .card.on{border-color:var(--coral);box-shadow:0 0 0 3px rgba(238,123,106,.15)}
.pipe b{font-family:'Fraunces',serif;font-size:28px;display:block}.pipe small{font-weight:800;color:var(--muted);font-size:12px}
.att-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.att-item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.att-item>div:nth-child(2){flex:1;min-width:0}.att-item b{display:block;font-size:14px}.att-item small{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--cream2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;color:var(--muted)}
.seg button.p{background:var(--sage);color:#fff}.seg button.a{background:var(--coral);color:#fff}
.rep{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.rep .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.rep .rg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.rep .rg div{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:13px}.rep .rg small{display:block;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase}
.child{display:flex;gap:20px;align-items:center;background:linear-gradient(120deg,#FDE3DB,#F8EED9 60%,#E3F0E7);border-radius:24px;padding:28px;margin-bottom:22px;flex-wrap:wrap}
.child h2{font-size:30px}.child .tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--cream)}
.cal .h{background:none;font-size:11px;color:var(--muted);aspect-ratio:auto;padding:4px}
.cal .P{background:#D9EDDF;color:#2F7A4B}.cal .A{background:#FBD9D3;color:#B33A2B}.cal .x{background:none}
.empty{text-align:center;padding:50px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}
.empty div{font-size:40px;margin-bottom:8px}
.msg{display:flex;gap:14px;padding:16px;border:1px solid var(--line);background:#fff;border-radius:16px;margin-bottom:10px;cursor:pointer;align-items:center}
.msg.unread{border-left:4px solid var(--coral)}.msg div{flex:1;min-width:0}.msg p{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gadm{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.gadm .gc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gadm .ph{height:150px}.gadm .gb{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gadm .gb b{font-size:14px;display:block}.gadm .gb small{color:var(--muted);font-size:12px}
.prog-bar{height:8px;background:var(--cream2);border-radius:99px;overflow:hidden;margin-top:6px}.prog-bar i{display:block;height:100%;background:var(--sage);border-radius:99px}
/* MODAL & TOAST */
.mback{position:fixed;inset:0;background:rgba(30,27,46,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:200;padding:20px;animation:fi .2s}
.mbox{background:#fff;border-radius:26px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:30px;animation:up .25s}
.mbox.img{padding:0;width:min(1000px,100%);background:none}.mbox.img img{border-radius:20px;max-height:85vh;margin:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.mh h3{font-size:24px}
.x{background:var(--cream2);border:0;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(20px);opacity:0}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:grid;gap:8px}
.tst{background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--sh);animation:up .3s}
.tst.err{background:#B33A2B}
.overlay{display:none}
.links .mob-only{display:none}.links.open .mob-only{display:block}
/* RESPONSIVE */
@media(max-width:1080px){.kpi{grid-template-columns:repeat(2,1fr)}.gadm{grid-template-columns:repeat(3,1fr)}.steps{grid-template-columns:repeat(3,1fr)}.day{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){
 .hero-grid,.split,.auth{grid-template-columns:1fr}.collage{height:440px}.split .ph{height:360px}
 .g3,.g4{grid-template-columns:repeat(2,1fr)}footer .fg{grid-template-columns:1fr 1fr}
 .links,.nav-cta{display:none}.burger{display:block}
 .links.open{display:flex;flex-direction:column;position:absolute;top:80px;left:0;right:0;background:var(--cream);padding:24px;border-bottom:1px solid var(--line);gap:18px;align-items:flex-start}
 .auth>.ph{display:none}
 .shell{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;width:270px;transform:translateX(-100%);transition:.3s}
 .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.3)}
 .overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
 .menu-t{display:grid;place-items:center}
 .dg2,.dg3,.dg11{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(3,1fr)}
 .band{grid-template-columns:repeat(2,1fr)}.cta{padding:40px}
}
@media(max-width:640px){
 section{padding:64px 0}.g2,.g3,.g4,.f2,.kpi,.att-list,.day{grid-template-columns:1fr}
 .masonry{columns:2}.gadm{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr 1fr}.pipe{grid-template-columns:repeat(2,1fr)}
 .content{padding:20px 16px}.top{padding:14px 16px}.top h2{font-size:21px}.me div{display:none}
 .toolbar input,.toolbar select{min-width:0;width:100%}.toolbar .row{width:100%}
 footer .fg{grid-template-columns:1fr}.collage{height:360px}.float{display:none}.rep .rg{grid-template-columns:1fr 1fr}
}

/* ===== BRAND LOGO ===== */
.brand{display:inline-flex;align-items:center;flex:none}
.logo-img{height:58px;width:auto;display:block;max-width:none}
.brand.dark{background:#1B1928;padding:8px 14px;border-radius:14px;border:1px solid rgba(201,160,90,.35)}
.side .brand{padding:0!important;margin:4px 6px 22px;display:flex;justify-content:center}
.side .logo-img{height:auto;width:100%;max-width:214px}
footer .logo-img{height:64px}
.auth-box .logo-img{height:70px}
.rcpt-logo .logo-img{height:46px}
.ov-logo{width:120px;height:120px;border-radius:28px;background:rgba(27,25,40,.75);display:grid;place-items:center;margin-bottom:22px;border:1px solid rgba(201,160,90,.45);backdrop-filter:blur(6px)}
.ov-logo img{width:78px;height:auto}
.hero-mark{display:inline-flex;align-items:center;gap:10px}
.hero-mark img{height:26px;width:auto}
#splash{position:fixed;inset:0;z-index:999;background:#1B1928;display:grid;place-items:center;transition:opacity .6s}
#splash img{width:min(340px,70vw);animation:pulse 1.6s ease-in-out infinite}
#splash.hide{opacity:0;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.04);opacity:.85}}
@media(max-width:960px){.nav .logo-img{height:46px}}
@media(max-width:640px){.nav .logo-img{height:40px}.brand.dark{padding:6px 10px}}
@media print{#splash{display:none}}


.ldw{position:relative;display:inline-grid;place-items:center}
.ldw img{border-radius:50%;animation:ldBreath 1.8s ease-in-out infinite}
.ldw:after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:#C9A05A;border-right-color:rgba(201,160,90,.35);animation:ldSpin 1.1s linear infinite}
@keyframes ldSpin{to{transform:rotate(360deg)}}
@keyframes ldBreath{50%{transform:scale(.94);filter:brightness(1.15)}}
/* ===== LOADER ===== */
#splash{flex-direction:column;gap:18px;display:flex!important;align-items:center;justify-content:center}
#splash .ld{width:150px;height:150px;animation:none}
#splash .ld-logo{width:min(260px,64vw);opacity:.9;animation:none}
#splash .ld-txt{color:#C9A05A;font-family:Georgia,serif;font-style:italic;letter-spacing:.06em;font-size:14px}
#pageLoader{position:fixed;inset:0;z-index:500;background:rgba(27,25,40,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#pageLoader.on{display:flex}
#pageLoader img{width:110px;height:110px}
#pageLoader span{color:#E8CFA0;font-size:13px;letter-spacing:.08em}
.btn.busy{pointer-events:none;opacity:.85}
.btn .bl{width:22px;height:22px;border-radius:50%;background:#1B1928}
.inl-loader{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px;color:var(--muted)}
.inl-loader img{width:72px;height:72px;border-radius:50%;background:#1B1928}
.ph{background:#1B1928 var(--ldr) center/70px no-repeat}
</style>

<script>
/* Safe storage: works even when the browser/preview blocks localStorage (e.g. SharePoint/Teams preview, file sandbox) */
(function(){function mem(){var d={};return{getItem:function(k){return k in d?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}}}}
function ok(n){try{var s=window[n];s.setItem('__t','1');s.removeItem('__t');return s}catch(e){return null}}
window.LS=ok('localStorage')||mem();window.SS=ok('sessionStorage')||window.LS;
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.innerHTML='<div style="padding:40px;font-family:sans-serif"><h2>Little Aarodiv could not start</h2><p>'+(e.message||'Script error')+'</p><p>Please download the file and open it directly in Chrome or Edge.</p></div>'});})();
</script>

Object.assign(BADGE,{Upcoming:'blue',Completed:'grey'});
function crudView(key,top=''){const c=CRUD[key];return `${top}<div class="toolbar"><div class="row"><input placeholder="🔍  Search ${c.title.toLowerCase()}…" value="${esc(UI.q[key]||'')}" oninput="UI.q['${key}']=this.value;refreshTable('${key}')">${c.tools?c.tools():''}</div>
 <div class="tb-r"><button class="btn btn-g btn-s" onclick="exportCSV('${key}')">⤓ Export CSV</button><button class="btn btn-p btn-s" onclick="openForm('${key}')">+ Add ${c.sing}</button></div></div><div id="tbl-${key}">${tableHTML(key)}</div>`}
function tableHTML(key){const c=CRUD[key];const q=(UI.q[key]||'').toLowerCase();
 let rows=db[key].filter(r=>(!c.filter||c.filter(r))&&(!q||JSON.stringify(r).toLowerCase().includes(q)||(r.studentId&&stu(r.studentId).name.toLowerCase().includes(q))));
 if(!rows.length)return `<div class="empty"><div>🌼</div>No ${c.title.toLowerCase()} found.</div>`;
 return `<div class="tbl-wrap"><table><thead><tr>${c.cols.map(x=>`<th>${x[0]}</th>`).join('')}<th style="text-align:right">Actions</th></tr></thead><tbody>${rows.map(r=>`<tr>${c.cols.map(x=>`<td>${x[1](r)}</td>`).join('')}<td><div class="acts">${c.extra?c.extra(r):''}<button class="btn btn-g btn-xs" onclick="openForm('${key}','${r.id}')">Edit</button><button class="btn btn-d btn-xs" onclick="delRow('${key}','${r.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>
 <p class="muted" style="font-size:13px;margin-top:10px">Showing ${rows.length} of ${db[key].length} records</p>`}
function refreshTable(k){$('#tbl-'+k).innerHTML=tableHTML(k)}
function field(f,v){v=v??'';const n=`name="${f.k}" ${f.req?'required':''}`;
 if(f.t==='select')return `<select ${n}>${opts(f.o).map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.l||'—')}</option>`).join('')}</select>`;
 if(f.t==='textarea')return `<textarea ${n}>${esc(v)}</textarea>`;
 return `<input type="${f.t||'text'}" ${n} value="${esc(v)}">`}
function openForm(key,id,preset){const c=CRUD[key];const r=id?db[key].find(x=>x.id===id):(preset||{});
 modal((id?'Edit ':'Add ')+c.sing,`<form id="cf" class="f" onsubmit="return saveForm(event,'${key}','${id||''}')"><div class="f2">${c.fields.map(f=>`<div style="${f.t==='textarea'?'grid-column:1/-1':''}"><label>${f.l}${f.req?' *':''}</label>${field(f,r[f.k])}</div>`).join('')}</div></form>`,
 `<button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="$('#cf').requestSubmit()">${id?'Save changes':'Create '+c.sing}</button>`)}
function saveForm(e,key,id){e.preventDefault();const c=CRUD[key];const d=Object.fromEntries(new FormData(e.target));c.fields.forEach(f=>{if(f.t==='number')d[f.k]=Number(d[f.k]||0)});
 if(id){const r=db[key].find(x=>x.id===id);const old=r.name;Object.assign(r,d);if(key==='programs'&&old!==d.name)db.students.forEach(s=>{if(s.program===old)s.program=d.name})}
 else{if(key==='fees'&&!d.status)d.status='Pending';db[key].unshift({id:uid(),...d})}
 save();closeModal();render();toast(c.sing+(id?' updated':' added')+' ✓');return false}
function delRow(key,id){if(!confirm('Delete this '+CRUD[key].sing.toLowerCase()+'? This cannot be undone.'))return;db[key]=db[key].filter(x=>x.id!==id);save();render();toast('Deleted')}
function exportCSV(key){withLoader('Preparing export…',()=>_exportCSV(key),500)}
function _exportCSV(key){const rows=db[key];if(!rows.length)return toast('Nothing to export','err');const ks=[...new Set(rows.flatMap(Object.keys))];
 const csv=[ks.join(','),...rows.map(r=>ks.map(k=>`"${String(k==='studentId'?stu(r[k]).name:r[k]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`little-aarodiv-${key}-${todayStr()}.csv`;a.click();toast('CSV downloaded')}

function enrollInquiry(id){const i=db.inquiries.find(x=>x.id===id);closeModal();
 openForm('students',null,{name:i.child,program:i.program,parent:i.parent,phone:i.phone,email:i.email,joined:todayStr(),status:'Active',allergies:'None'});
 const f=$('#cf');f.onsubmit=e=>{saveForm(e,'students','');i.status='Enrolled';save();render();return false}}
function markPaid(id){const f=db.fees.find(x=>x.id===id);modal('Record payment',`<p class="muted" style="margin-bottom:16px">${esc(stu(f.studentId).name)} · ${fmon(f.month)} · <b style="color:var(--ink)">${fmt(f.amount)}</b></p><div class="f2"><div><label>Payment mode</label><select id="pm"><option>UPI</option><option>Card</option><option>Net Banking</option><option>Cash</option><option>Cheque</option></select></div><div><label>Paid on</label><input id="pd" type="date" value="${todayStr()}"></div></div>`,
 `<button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="confirmPaid('${id}',$('#pm').value,$('#pd').value)">Confirm payment</button>`)}
function confirmPaid(id,mode,on){closeModal();showLoader('Processing payment…');setTimeout(()=>{hideLoader();_confirmPaid(id,mode,on)},1000)}

const T={
 dashboard(){const u=session();const kids=db.students.filter(s=>s.program===u.program&&s.status==='Active');const t=todayAtt(kids.map(k=>k.id));const rp=db.reports.filter(r=>r.date===todayStr()&&kids.some(k=>k.id===r.studentId)).length;
  return `<div class="child"><span style="font-size:52px">🍎</span><div><h2>${esc(u.program)} class</h2><p class="muted">${kids.length} little learners · ${esc(progOf(u.program).timing||'')}</p></div></div>
  <div class="kpi">${kpi('🧒','t-sky',kids.length,'Students')}${kpi('✅','t-sage',t.p,'Present today')}${kpi('⏳','t-gold',t.u,'Attendance pending')}${kpi('🌈','t-coral',`${rp}/${kids.length}`,'Reports posted today')}</div>
  <div class="dg dg11"><div class="panel"><div class="ph-h"><h3>Quick actions</h3></div><div class="grid g2" style="gap:12px"><a class="btn btn-p" href="#/teacher/attendance">✅ Take attendance</a><a class="btn btn-g" href="#/teacher/daily">🌈 Post daily report</a><a class="btn btn-g" href="#/teacher/class">🧒 View class</a><a class="btn btn-g" href="#/teacher/notices">📢 Notices</a></div>
  <h3 style="margin:24px 0 8px">Health alerts</h3>${kids.filter(k=>k.allergies&&k.allergies!=='None').map(k=>`<div class="list-i">${avatar(k.name)}<div><b>${esc(k.name)}</b><small>⚠️ ${esc(k.allergies)}</small></div></div>`).join('')||'<p class="muted">No alerts.</p>'}</div>
  <div class="panel"><h3 style="margin-bottom:12px">Upcoming events</h3>${eventGrid(['All','Staff']).replace('g2','')}</div></div>`},
 class(){const u=session();const kids=db.students.filter(s=>s.program===u.program&&s.status==='Active');
  return `<div class="grid g3">${kids.map(k=>`<div class="card"><div class="nm">${avatar(k.name,'lg')}<div><h3 style="font-size:20px">${esc(k.name)}</h3><small>${esc(k.gender)} · ${fdate(k.dob)}</small></div></div><div style="margin-top:16px;font-size:14px;display:grid;gap:6px"><span>👪 ${esc(k.parent)}</span><span>📞 ${esc(k.phone)}</span><span>${k.allergies&&k.allergies!=='None'?'⚠️ '+esc(k.allergies):'✅ No known allergies'}</span><span>📊 Attendance <b>${attPct(k.id)}%</b></span></div></div>`).join('')||empty('No students assigned.')}</div>`},
 attendance:()=>attendanceView('teacher'),daily:()=>dailyView('teacher'),notices:()=>noticeList(['All','Staff']),events:()=>eventGrid(['All','Staff'])
};

/* ============ PARENT VIEWS ============ */
const PV={
 dashboard(){const u=session();const k=stu(u.studentId);const p=progOf(k.program);const last=db.reports.filter(r=>r.studentId===k.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const due=db.fees.filter(f=>f.studentId===k.id&&f.status!=='Paid');const td=(db.attendance[todayStr()]||{})[k.id];
  return `<div class="child">${avatar(k.name,'lg')}<div style="flex:1"><h2>${esc(k.name)}</h2><div class="tags"><span class="badge b-lav">${esc(k.program)}</span><span class="badge b-blue">${esc(p.timing||'')}</span>${badge(k.status)}</div></div><div style="text-align:right"><small class="muted">Today</small><div style="font-family:Fraunces;font-size:22px">${td==='P'?'✅ At school':td==='A'?'🏠 Absent':'⏳ Not marked'}</div></div></div>
  <div class="kpi">${kpi('📊','t-sage',attPct(k.id)+'%','Attendance')}${kpi('💳','t-gold',due.length?fmt(due.reduce((a,f)=>a+f.amount,0)):'All clear','Fees due')}${kpi('🌈','t-coral',db.reports.filter(r=>r.studentId===k.id).length,'Daily reports')}${kpi('📅','t-sky',db.events.filter(e=>e.date>=todayStr()&&e.audience!=='Staff').length,'Upcoming events')}</div>
  <div class="dg dg11"><div class="panel"><div class="ph-h"><h3>Latest daily report</h3><a class="btn btn-g btn-xs" href="#/parent/daily">All reports</a></div>${last?repCard(last):empty('No report yet today.')}</div>
  <div class="panel"><div class="ph-h"><h3>Notices</h3><a class="btn btn-g btn-xs" href="#/parent/notices">View all</a></div>${db.notices.filter(n=>n.audience!=='Staff').slice(0,3).map(n=>`<div class="list-i"><span class="av" style="background:var(--cream2);color:var(--ink)">📢</span><div><b>${esc(n.title)}</b><small>${fdate(n.date)}</small></div></div>`).join('')}
  ${due.length?`<div class="cta" style="padding:20px;border-radius:18px;margin-top:16px"><div><b>${fmt(due[0].amount)}</b> due for ${fmon(due[0].month)}</div><a class="btn btn-p btn-s" href="#/parent/fees">Pay now</a></div>`:''}</div></div>`},
 attendance(){const k=stu(session().studentId);const now=new Date();const y=UI.py??now.getFullYear(),m=UI.pm??now.getMonth();const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let p=0,a=0;const cells=[];for(let i=0;i<first;i++)cells.push('<div class="x"></div>');for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const v=(db.attendance[ds]||{})[k.id]||'';if(v==='P')p++;if(v==='A')a++;cells.push(`<div class="${v}" title="${ds}">${d}</div>`)}
  return `<div class="kpi">${kpi('📊','t-sage',attPct(k.id)+'%','Overall attendance')}${kpi('✅','t-sky',p,'Present this month')}${kpi('🚫','t-coral',a,'Absent this month')}${kpi('🧒','t-gold',esc(k.name.split(' ')[0]),k.program)}</div>
  <div class="panel" style="max-width:640px"><div class="ph-h"><button class="btn btn-g btn-xs" onclick="shiftM(-1)">← Prev</button><h3>${new Date(y,m).toLocaleString('en-IN',{month:'long',year:'numeric'})}</h3><button class="btn btn-g btn-xs" onclick="shiftM(1)">Next →</button></div>
  <div class="cal">${['S','M','T','W','T','F','S'].map(d=>`<div class="h">${d}</div>`).join('')}${cells.join('')}</div><div class="legend" style="margin-top:16px"><span><i style="background:#D9EDDF"></i>Present</span><span><i style="background:#FBD9D3"></i>Absent</span></div></div>`},
 daily(){const k=stu(session().studentId);const l=db.reports.filter(r=>r.studentId===k.id).sort((a,b)=>b.date.localeCompare(a.date));return l.length?`<div class="grid g2">${l.map(r=>repCard(r)).join('')}</div>`:empty('No daily reports yet.')},
 fees(){const k=stu(session().studentId);const l=db.fees.filter(f=>f.studentId===k.id).sort((a,b)=>b.month.localeCompare(a.month));const due=l.filter(f=>f.status!=='Paid');
  return `<div class="kpi">${kpi('💳','t-gold',fmt(due.reduce((a,f)=>a+f.amount,0)),'Outstanding')}${kpi('✅','t-sage',fmt(l.filter(f=>f.status==='Paid').reduce((a,f)=>a+f.amount,0)),'Paid to date')}${kpi('📚','t-sky',fmt(progOf(k.program).fee),'Monthly fee')}${kpi('🧾','t-coral',l.length,'Invoices')}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Month</th><th>Amount</th><th>Due date</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody>${l.map(f=>`<tr><td><b>${fmon(f.month)}</b></td><td>${fmt(f.amount)}</td><td>${fdate(f.due)}</td><td>${badge(feeStatus(f))}</td><td><div class="acts">${f.status==='Paid'?`<button class="btn btn-g btn-xs" onclick="receipt('${f.id}')">Receipt</button>`:`<button class="btn btn-p btn-xs" onclick="payNow('${f.id}')">Pay now</button>`}</div></td></tr>`).join('')}</tbody></table></div>`},
 gallery(){return `<div class="masonry">${db.gallery.map((g,i)=>`<div class="gi" onclick="lightbox('${esc(IMG(g.url))}')">${ph(g.url,'',`height:${[240,300,220,280][i%4]}px`)}<div class="cap">${esc(g.title)}<small>${esc(g.category)}</small></div></div>`).join('')}</div>`},
 events:()=>eventGrid(['All','Parents']),notices:()=>noticeList(['All','Parents'])
};
function shiftM(d){const n=new Date();let m=(UI.pm??n.getMonth())+d,y=UI.py??n.getFullYear();if(m<0){m=11;y--}if(m>11){m=0;y++}UI.pm=m;UI.py=y;render()}
function payNow(id){const f=db.fees.find(x=>x.id===id);modal('Secure payment',`<div style="text-align:center;margin-bottom:20px"><small class="muted">Amount payable</small><div style="font-family:Fraunces;font-size:44px">${fmt(f.amount)}</div><small class="muted">${esc(stu(f.studentId).name)} · ${fmon(f.month)}</small></div>
 <label>Choose payment method</label><div class="tabs" style="margin:6px 0 16px" id="pt">${['UPI','Card','Net Banking'].map((x,i)=>`<button type="button" class="${i?'':'on'}" onclick="document.querySelectorAll('#pt button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div>
 <p class="muted" style="font-size:13px">🔒 Payments are encrypted & processed securely. A receipt will be available instantly.</p>`,`<button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="confirmPaid('${id}',$('#pt .on').textContent,todayStr());setTimeout(()=>receipt('${id}'),1200)">Pay ${fmt(f.amount)}</button>`)}

const VIEWS={admin:A,teacher:T,parent:PV};
(function(){document.getElementById('splash-ld').src=LOADER_SRC;document.getElementById('pl-img').src=LOADER_SRC;document.documentElement.style.setProperty('--ldr','url('+LOADER_SRC+')');setTimeout(()=>{const el=document.getElementById('splash');if(el){el.classList.add('hide');setTimeout(()=>el.remove(),700)}},1600)})();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>render(true));else render(true);
</script>
</body>
